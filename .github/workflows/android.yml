name: Android build

on:
  push:
    branches: ["claude/**", main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core)
        run: ./gradlew :core:test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AlramMail.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AlramMail-debug-apk
          path: AlramMail.apk

      # 폰 브라우저에서 바로 내려받을 수 있도록 최신 APK 를 고정 주소의 릴리스로 올린다.
      - name: Publish latest APK release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest-debug
          git push -f origin latest-debug
          gh release delete latest-debug --yes 2>/dev/null || true
          gh release create latest-debug AlramMail.apk \
            --prerelease \
            --title "최신 디버그 빌드 (#${{ github.run_number }})" \
            --notes "커밋 ${GITHUB_SHA::7} 에서 자동 빌드된 APK 입니다. 폰에서 내려받아 설치하세요."
