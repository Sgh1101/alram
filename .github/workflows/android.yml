name: Android build

on:
  push:
    branches: ["claude/**", main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core)
        run: ./gradlew :core:test --stacktrace

      # 배포용은 release 빌드(같은 고정 키로 서명). 테스트용 구성 요소가 섞이지 않는다.
      - name: Build APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk AlramMail.apk

      # 실제 화면을 렌더링한 스크린샷(디자인 확인용). 실패해도 APK 배포는 계속한다.
      - name: Screenshot tests
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Pack screenshots
        if: always()
        run: |
          if ls app/screenshots/*.png >/dev/null 2>&1; then
            (cd app/screenshots && zip -q ../../screenshots.zip *.png)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: AlramMail-debug-apk
          path: AlramMail.apk

      # 폰 브라우저에서 바로 내려받을 수 있도록 최신 APK 를 고정 주소의 릴리스로 올린다.
      - name: Publish latest APK release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest-debug
          git push -f origin latest-debug
          gh release delete latest-debug --yes 2>/dev/null || true
          ASSETS="AlramMail.apk"
          [ -f screenshots.zip ] && ASSETS="$ASSETS screenshots.zip"
          gh release create latest-debug $ASSETS \
            --prerelease \
            --title "최신 디버그 빌드 (#${{ github.run_number }})" \
            --notes "커밋 ${GITHUB_SHA::7} 에서 자동 빌드된 APK 입니다. 폰에서 내려받아 설치하세요."
